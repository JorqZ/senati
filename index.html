<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ec4899">
  <title>Iniciar sesión | SENATI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="login-card" aria-labelledby="login-title">
      <div class="brand-mark" aria-hidden="true">S</div>
      <p class="eyebrow">BIENVENIDO</p>
      <h1 id="login-title">Inicia sesión</h1>
      <p class="subtitle">Ingresa tus datos para continuar.</p>
      <form id="login-form">
        <label for="email">Correo electrónico</label>
        <input id="email" name="email" type="email" placeholder="nombre@correo.com" autocomplete="username" required>
        <div class="password-heading">
          <label for="password">Contraseña</label>
        </div>
        <div class="password-wrap">
          <input id="password" name="password" type="password" placeholder="Ingresa tu contraseña" autocomplete="current-password" required minlength="4">
          <button class="show-password" id="toggle-password" type="button" aria-label="Mostrar contraseña">Ver</button>
        </div>
        <button class="submit-btn" type="submit">Entrar <span aria-hidden="true">→</span></button>
        <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
      </form>
      <p class="footer-note">Plataforma de acceso · SENATI</p>
    </section>
    <p class="copyright">© 2026 SENATI · Acceso de usuarios</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
