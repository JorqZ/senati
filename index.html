<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#db2777">
  <meta name="description" content="Portal de acceso SENATI">
  <title>Iniciar sesión | SENATI</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap');
    :root{font-family:'DM Sans',Arial,sans-serif;color:#2b2030;background:#fce7f3;font-synthesis:none}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh}
    .page{min-height:100vh;display:grid;place-items:center;padding:28px 18px;background:radial-gradient(circle at 12% 18%,rgba(255,255,255,.72),transparent 27%),radial-gradient(circle at 90% 85%,rgba(244,114,182,.3),transparent 30%),linear-gradient(135deg,#fbcfe8,#f9a8d4 48%,#fce7f3)}
    .layout{width:min(100%,980px);min-height:590px;display:grid;grid-template-columns:1.05fr .95fr;overflow:hidden;border:1px solid rgba(255,255,255,.8);border-radius:28px;background:rgba(255,255,255,.94);box-shadow:0 28px 90px rgba(157,23,77,.18)}
    .intro{position:relative;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;padding:48px;color:white;background:linear-gradient(145deg,#ec4899 0%,#db2777 52%,#9d174d 100%)}
    .intro:before,.intro:after{position:absolute;content:"";border:1px solid rgba(255,255,255,.16);border-radius:50%}
    .intro:before{width:370px;height:370px;right:-170px;top:-130px}
    .intro:after{width:280px;height:280px;right:-95px;top:-85px}
    .brand{position:relative;z-index:1;display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.08em}
    .brand-icon{display:grid;place-items:center;width:42px;height:42px;border:1px solid rgba(255,255,255,.45);border-radius:13px;background:rgba(255,255,255,.15);font-size:22px}
    .intro-copy{position:relative;z-index:1;max-width:390px;margin:55px 0}
    .tag{margin:0 0 15px;font-size:11px;font-weight:800;letter-spacing:.2em;opacity:.8}
    .intro h2{margin:0;font-size:clamp(34px,5vw,52px);line-height:1.08;letter-spacing:-.05em}
    .intro-copy p:last-child{max-width:330px;margin:20px 0 0;color:rgba(255,255,255,.83);font-size:15px;line-height:1.7}
    .intro-foot{position:relative;z-index:1;color:rgba(255,255,255,.72);font-size:11px}
    .form-side{display:flex;align-items:center;justify-content:center;padding:48px 44px}
    .login{width:100%;max-width:360px}
    .brand-mark{display:grid;place-items:center;width:48px;height:48px;border-radius:15px;color:white;font-size:23px;font-weight:800;background:linear-gradient(145deg,#ec4899,#be185d);box-shadow:0 8px 18px rgba(219,39,119,.22)}
    .eyebrow{margin:25px 0 7px;color:#db2777;font-size:10px;font-weight:800;letter-spacing:.19em}
    h1{margin:0;font-size:32px;letter-spacing:-.045em}
    .subtitle{margin:9px 0 28px;color:#8c7d8c;font-size:13px;line-height:1.6}
    form{display:flex;flex-direction:column;gap:10px}
    label{color:#493b4a;font-size:12px;font-weight:700}
    input{width:100%;height:48px;margin:0 0 8px;padding:0 14px;border:1px solid #eadde6;border-radius:11px;outline:none;color:#2b2030;background:#fffafd;font:inherit;font-size:13px;transition:border-color .2s,box-shadow .2s}
    input:focus{border-color:#ec4899;box-shadow:0 0 0 3px rgba(236,72,153,.13)}
    .password-wrap{position:relative}.password-wrap input{padding-right:70px}
    .show{position:absolute;top:9px;right:9px;height:30px;padding:0 9px;border:0;border-radius:7px;color:#be185d;background:#fce7f3;font:inherit;font-size:11px;font-weight:700;cursor:pointer}
    .submit{display:flex;align-items:center;justify-content:center;gap:12px;height:50px;margin-top:9px;border:0;border-radius:11px;color:white;background:linear-gradient(100deg,#ec4899,#be185d);box-shadow:0 9px 20px rgba(219,39,119,.22);font:inherit;font-size:13px;font-weight:800;cursor:pointer;transition:transform .2s,box-shadow .2s}
    .submit:hover{transform:translateY(-1px);box-shadow:0 12px 24px rgba(219,39,119,.28)}
    .submit:focus-visible,.show:focus-visible{outline:3px solid #f9a8d4;outline-offset:3px}
    .feedback{min-height:34px;margin:4px 0 0;color:#be185d;font-size:11px;line-height:1.5;text-align:center}
    .secure{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:17px;color:#a394a2;font-size:10px}
    .secure span{color:#db2777}
    @media(max-width:720px){.layout{max-width:470px;min-height:0;grid-template-columns:1fr}.intro{min-height:205px;padding:25px 28px}.intro-copy{margin:28px 0 10px}.intro h2{font-size:32px}.intro-copy p:last-child{margin-top:10px;font-size:13px}.intro-foot{display:none}.form-side{padding:34px 28px 26px}}
    @media(max-width:380px){.form-side{padding:30px 21px 22px}.intro{padding:23px}}
  </style>
</head>
<body>
  <main class="page">
    <div class="layout">
      <section class="intro" aria-label="Presentación">
        <div class="brand"><span class="brand-icon">S</span><span>SENATI</span></div>
        <div class="intro-copy">
          <p class="tag">PORTAL DE ACCESO</p>
          <h2>Aprende.<br>Crece.<br>Conecta.</h2>
          <p>Un espacio para continuar tu camino de aprendizaje y acceder a tus herramientas.</p>
        </div>
        <div class="intro-foot">Formación para el futuro · SENATI</div>
      </section>
      <section class="form-side">
        <div class="login">
          <div class="brand-mark" aria-hidden="true">S</div>
          <p class="eyebrow">QUÉ BUENO TENERTE AQUÍ</p>
          <h1>Bienvenido</h1>
          <p class="subtitle">Ingresa tus datos para continuar a la plataforma.</p>
          <form id="login-form">
            <label for="email">Correo electrónico</label>
            <input id="email" name="email" type="email" placeholder="nombre@correo.com" autocomplete="username" required>
            <label for="password">Contraseña</label>
            <div class="password-wrap">
              <input id="password" name="password" type="password" placeholder="Escribe tu contraseña" autocomplete="current-password" required minlength="4">
              <button class="show" id="toggle-password" type="button" aria-label="Mostrar contraseña">Ver</button>
            </div>
            <button class="submit" type="submit">Iniciar sesión <span aria-hidden="true">→</span></button>
            <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
          </form>
          <div class="secure"><span>●</span> Acceso de usuarios · SENATI</div>
        </div>
      </section>
    </div>
  </main>
  <script>
    const form=document.getElementById('login-form');
    const password=document.getElementById('password');
    const toggle=document.getElementById('toggle-password');
    const feedback=document.getElementById('feedback');
    toggle.addEventListener('click',()=>{
      const show=password.type==='password';
      password.type=show?'text':'password';
      toggle.textContent=show?'Ocultar':'Ver';
      toggle.setAttribute('aria-label',show?'Ocultar contraseña':'Mostrar contraseña');
    });
    form.addEventListener('submit',event=>{
      event.preventDefault();
      if(!form.reportValidity())return;
      feedback.textContent='Esta es una vista de demostración. Conecta el formulario a PHP y MySQL para validar las cuentas.';
    });
  </script>
</body>
</html>
